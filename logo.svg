<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo con degradado místico oscuro -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="60%" stop-color="#120303"/>
      <stop offset="100%" stop-color="#070101"/>
    </radialGradient>
    
    <!-- Brillo dorado para las líneas del dado -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#b78103"/>
    </linearGradient>

    <!-- Brillo de fuego central -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo del Icono -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Borde rúnico exterior del icono -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="15, 10"/>
  <rect x="28" y="28" width="456" height="456" rx="82" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Aura de magia roja detrás del dado -->
  <circle cx="256" cy="256" r="110" fill="#ff2a2a" opacity="0.15" filter="url(#glow)"/>

  <!-- EL DADO D20 (Geometría de fantasía oscura) -->
  <g transform="translate(0, 5)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="#1a0b0b" fill-opacity="0.85">
    <!-- Triángulo Central -->
    <polygon points="256,150 160,310 352,310" fill="#2d1212"/>
    
    <!-- Triángulos Superiores y Laterales -->
    <polygon points="256,70 160,150 256,150" />
    <polygon points="256,70 256,150 352,150" />
    <polygon points="256,70 352,150 430,220" />
    <polygon points="256,70 160,150 82,220" />
    
    <!-- Laterales Medios -->
    <polygon points="160,150 82,220 160,310" />
    <polygon points="352,150 430,220 352,310" />
    
    <!-- Triángulos Inferiores -->
    <polygon points="160,310 256,430 352,310" fill="#2d1212"/>
    <polygon points="82,220 160,310 120,390" />
    <polygon points="430,220 352,310 392,390" />
    <polygon points="160,310 120,390 256,430" />
    <polygon points="352,310 392,390 256,430" />
  </g>

  <!-- El número 20 grabado en el centro con tipografía épica -->
  <text x="256" y="275" font-family="'Cinzel', 'Georgia', serif" font-size="68" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">20</text>
</svg>
